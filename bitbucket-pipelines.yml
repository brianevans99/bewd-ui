# Node 24 matches .nvmrc. Angular 22's CLI requires Node >= 22.22.3, and the
# 24 line must be at least 24.15.0. The image tag tracks the current 24.x release.
image: node:24

definitions:
  caches:
    npm: ~/.npm
  steps:
    - step: &verify
        name: Lint, test, and build @bravoechoweb/ui
        caches:
          - npm
        script:
          - npm ci
          # One library, so run-many always checks it. `nx affected` on a
          # shallow main push can decide nothing changed and skip the build.
          - npx nx run-many -t lint,test,build -p ui
    - step: &publish
        name: Publish @bravoechoweb/ui
        caches:
          - npm
        script:
          - npm ci
          - npx nx build ui
          # The tag is v1.2.3 and the package version must be 1.2.3.
          - node -e "const v=require('./dist/libs/ui/package.json').version; const tag=(process.env.BITBUCKET_TAG||'').replace(/^v/,''); if(!tag||v!==tag){console.error('Tag '+JSON.stringify(process.env.BITBUCKET_TAG)+' does not match package version '+v); process.exit(1)}"
          # NPM_TOKEN is a secured Bitbucket repository variable. .npmrc reads it.
          # publishConfig.access is also restricted, so this cannot go public.
          - npm publish dist/libs/ui --access restricted

pipelines:
  pull-requests:
    '**':
      - step: *verify
  branches:
    main:
      - step: *verify
  tags:
    'v*':
      - step: *publish
